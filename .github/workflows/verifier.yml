name: verifier
on:
  push:
  pull_request:
jobs:
  textured:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/textured/skills/textured
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: construire et vérifier (Chrome est déjà sur l'image)
        run: python3 tests/verifier.py --pdf
